name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.x"]
        exclude:
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tools/release_check.py
