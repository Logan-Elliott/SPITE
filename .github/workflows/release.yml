name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Check tag and build
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          python3 tools/release_check.py
      - name: Attest operator archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/agent-skill-redteam-harness-*-macos.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/agent-skill-redteam-harness-*-macos.zip
          dist/agent-skill-redteam-harness-*-macos.zip.sha256
          --verify-tag --generate-notes
